approval_policy = "on-request"
default_permissions = "seeksaas"

[permissions.seeksaas]
extends = ":workspace"

[permissions.seeksaas.filesystem]
glob_scan_max_depth = 3

[permissions.seeksaas.filesystem.":workspace_roots"]
"**/*.env" = "deny"
"**/.env.*" = "deny"
"**/.dev.vars" = "deny"
"**/wrangler.jsonc" = "deny"
